# Resplandy configuration. Secrets live in .env, never here.
# Every number below comes from docs/ARCHITECTURE.md. Change the spec and this file together.

timezone: Asia/Singapore                     # every timestamp we write carries this offset (+08:00)

models:
  writer: anthropic/claude-sonnet-5.5        # Lit reviewer and Planner
  reviewer: deepseek/deepseek-v4.1-flash     # other model family than the writer
  judge: deepseek/deepseek-v4.1-flash        # pinned: never give the judge a fallback list
  fallbacks:
    writer: []                               # add one model id after checking openrouter.ai/models
    reviewer: []
  structured_output:                         # per model id, from its page: json_schema | tool (one forced tool call)
    anthropic/claude-sonnet-5.5: json_schema
    deepseek/deepseek-v4.1-flash: json_schema

openrouter:
  base_url: https://openrouter.ai/api/v1
  require_parameters: true                   # only endpoints that can enforce the JSON schema
  timeout_seconds: 90
  max_retries: 1

limits:
  max_llm_calls_per_run: 40                  # a call answered from the cache counts too
  max_cost_usd_per_run: 1.0                  # with no cap (null) a live call is refused
  max_steps_per_agent: 6
  max_papers_per_search: 25
  max_claims_per_run: 20                     # the judge is called once per claim
  max_queries: 4                             # keyword queries per question
  max_library_hits_per_query: 5
  max_library_pages_per_run: 6               # full pages of library files given to the summariser
  max_sources_per_run: 16                    # library pages plus abstracts given to the summariser
  max_gaps: 3
  receipt_positive_queries: 3                # per search receipt
  receipt_negative_queries: 2
  receipt_nearest_papers: 3
  reviewer_rounds: 1                         # the design says 2; one round is built today
  repair_rounds: 1

planning:
  max_task_hours: 8                          # "a task of one day or less"
  default_owner: me

scheduler:
  days_after_deadline: 14                    # the calendar is read this far past the deadline, to show a late option

verification:
  mode: calibrate                            # stays calibrate; code never rewrites this file. The mode in force is
                                             # deployed only with a stored Suite J pass for this judge and rubric
  quote_min_score: 0.95
  title_min_similarity: 0.90
  year_warning_offset: 1                     # off by exactly 1 warns; off by 2 or more fails
  judge_gate:
    seeded_tuning: 20
    seeded_held_back: 60
    max_wrong_passes: 1                      # of the 60 held-back seeded claims
    min_label_agreement: 0.90                # 18 of the first 20 human labels

audit:
  every_runs: 10
  sample_size: 10
  passed_in_sample: 7                        # the other 3 are claims the judge failed
  recalibrate_at_disagreements: 2

lessons:
  max_proposed_per_run: 3
  min_runs_seen: 2
  max_loaded_per_role: 5
  roles: [lit_reviewer, planner, reviewer]   # never the judge

library:
  default_folder: data/library               # a study may point at any other folder instead
  max_files: 500
  doi_search_pages: 2                        # a DOI counts only with its record's title on these pages

tracker:
  spi_remind_below: 0.90
  spi_replan_below: 0.75
  k_min_tasks_per_type: 3
  k_min: 0.5
  k_max: 3.0
  job_interval_minutes: 60

notify:
  max_per_task_per_hour: 1
  telegram: false

apis:
  arxiv_min_interval_seconds: 3
  http_cache_days: 7
  timeout_seconds: 20

guardrails:
  injection_patterns:                        # found in paper text: logged in the trace; the text stays data
    - "ignore (all |any |the )?(previous|prior|above|earlier) instructions"
    - "disregard (all |any |the )?(previous|prior|above|earlier)"
    - "you are now"
    - "system prompt"
    - "new instructions:"
  gap_overclaims:                            # a gap is a candidate, never a claim that nothing exists
    - "no one has"
    - "nobody has"
    - "has never been"
    - "have never been"
    - "has not been studied"
    - "no (previous |prior |existing )?(study|studies|work|research) (has|have|exists?)"

paths:
  database: data/resplandy.sqlite
  cache: data/cache
  traces: traces
